[project]
name = "v2d-t3-tools"
version = "0.1.0"
description = "Team tooling shared by Path A and Path B: Track 3 episode manifest, local scoring, submission helpers"
requires-python = ">=3.11,<3.12"
dependencies = [
    # The submission kit's requirements.txt, plus scipy and pillow, which it uses but does not list.
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "trimesh>=4.0",
    "fast_simplification>=0.1",
    "pillow",  # missing from the kit: trimesh needs it to load textured meshes (.glb/.obj with textures)
    "kaggle>=2.0",
    "kagglesdk",
]

[tool.uv]
package = false
