[project]
name = "v2d-t3-path-b"
version = "0.1.0"
description = "Path B: Track 3 videos to kit-ready reconstruction bundles, with stereo metric scale and a loss report per stage"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Imported in-process from tools/track3 (run_load_retarget, score_local) and the kit's v2dlb:
    # the packages of tools/pyproject.toml, minus its Kaggle and Hugging Face clients.
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "scipy>=1.11",
    "trimesh>=4.0",
    "fast_simplification>=0.1",
    "pillow",
    "networkx",  # trimesh's stable poses, used by stage 2's levelling (cleaned_bundle)
    "rtree>=1.0",  # trimesh's nearest-surface queries (S5's contact hand-over check)
    # Phase A2 (spec §11): TSDF fusion, ICP, Poisson. 0.19.0: 0.20's macOS wheel needs Homebrew's libusb.
    "open3d==0.19.0",
    "scikit-image>=0.24",  # A2.2's voxel-solid closing (marching cubes) when Poisson balloons
    "threadpoolctl>=3.5",  # S3c: Open3D's OpenMP held to one thread, so a run repeats (its ICP sums vary in order)
    # Path B's own: video decoding, undistortion, rectification, feature matching.
    "opencv-python-headless>=4.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
