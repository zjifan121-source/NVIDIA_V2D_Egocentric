# S4c (Do as I Do) settings: names as in do-as-i-do retargeting/config/default.yaml and
# config/override/do_as_i_do.yaml. Values are DaiD's own do_as_i_do override unless marked
# "default:" (V4_BUILD_SPEC.md S4c). Read by pathb/drivers/daid_run.py in the daid venv;
# the stage adds per-episode values (warmup_duration from S4a's rest-before window).
# V4 S4c: gated off until the ep40 failures (the object never moved; read-back vs replay 43 mm,
# bar 5 mm) are fixed on ep41 (time-box one day, Task Queue #13).
enabled: false
optimizer:
  # default: the override's 1024 samples x 3.0 s horizon x up to 32 iterations per 0.5 s control step
  # took 8.5 min per control step on ep40 (L40S, 2026-10-23 smoke test): ~2.7 h per candidate, > 5 h
  # per object, ~370 GPU-h for phase B's S4c. DaiD's own default.yaml horizon and control step, a
  # quarter of the samples and half the iterations: ~1/15 of the cost. S4c's gate keeps the
  # kinematic reference whenever the realised one scores worse.
  horizon: 1.6               # default: s, planning horizon (DaiD default.yaml; override 3.0)
  num_samples: 256           # default: sampled control sequences per iteration (override 1024)
  ctrl_dt: 0.4               # default: s, control step (DaiD default.yaml; override 0.5)
  max_num_iterations: 16     # default: per control step, early stop as DaiD (override 32)
  terminal_rew_scale: 10.0   # failure/terminal weight (DaiD override)
  sim_dt: 0.005              # s (DaiD override)
  ref_dt: 0.02               # default: S4c resamples the 20.254 Hz video reference to 50 Hz = 4 sim steps
  max_sim_steps: 0           # 0 = the full (padded) trajectory
  seed: 0
sim:
  # default: DaiD's 120 contacts / 500 constraint rows per world overflow on ep40 (2026-10-23 smoke
  # test: the dust pan rests on the table as 31 CoACD pieces, 578 rows at frame 0); about 4x that,
  # with room for the grasp (memory: 1024 worlds x 2048 rows x ~70 dofs x 4 B ~ 0.6 GB)
  nconmax_per_env: 512
  njmax_per_env: 2048
warmup:
  # default: the weld lasts the rest-before window (set per episode); DaiD's override uses 3.0 s
  ref_interp_max: 3.0        # s, cap of warmup_ref_{base,finger}_interp_duration (DaiD override)
scene:
  # the table is the MuJoCo floor at z = 0 (spec): objects and hands collide with it, no pedestal
  object_floor_collision: true
  hand_floor_collision: true
  use_pedestal: false
  use_support: false
  add_ur3_arm: false         # FlashCHORD's Sharpa Wave hands float; no UR3 wrist cylinder
  friction_scale: 1.5        # launch.py's value
decompose:
  thicken: 0.002             # launch.py's values; S3a's CoACD pieces are used as they are
  dilate: 0.002
ik:
  smoothing: true            # launch.py's value
